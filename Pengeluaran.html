<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengeluaran Jalanan</title>
<style>
:root {
  --bg:#0b0d10; --panel:#11161c; --line:#1e2632; --fg:#d6deeb;
  --dim:#5f6b7a; --acc:#7dd3fc; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
}
* { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; padding-bottom:70px; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; }
.brand { color:var(--acc); font-weight:700; letter-spacing:2px; font-size:15px; }
.date-today { font-size:11px; color:var(--dim); }
main { padding:16px; max-width:600px; margin:0 auto; }
h2 { margin:16px 0 12px; font-size:14px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; }

/* NAV BAWAH */
.bottom-nav { position:fixed; bottom:0; left:0; width:100%; background:var(--panel); border-top:1px solid var(--line); display:flex; z-index:20; }
.bottom-nav button { flex:1; padding:12px 4px; background:transparent; border:none; color:var(--dim); font:12px ui-sans-serif; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
.bottom-nav button.active { color:var(--acc); background:#0e1319; border-top:2px solid var(--acc); }

/* KARTU TOTAL */
.total-box { background:var(--panel); border:1px solid var(--bad); border-radius:8px; padding:16px; text-align:center; margin-bottom:16px; box-shadow:0 0 15px rgba(248,113,113,0.1); }
.total-box label { display:block; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
.total-box .uang { font-size:32px; font-weight:bold; color:var(--bad); margin-top:4px; }

/* FORM & INPUT */
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:11px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; }
input, select { width:100%; padding:12px; background:#0e1319; color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; font-size:16px; }
input:focus, select:focus { outline:none; border-color:var(--acc); }
.btn { padding:12px; border-radius:6px; border:1px solid var(--line); background:#0e1319; color:var(--fg); cursor:pointer; font:inherit; font-weight:bold; width:100%; text-align:center; }
.btn.primary { background:var(--acc); color:#06232e; border-color:var(--acc); }
.btn.ok { background:var(--ok); color:#06232e; border-color:var(--ok); }
.btn.danger { color:var(--bad); border-color:var(--bad); background:rgba(248,113,113,.1); }

/* LIST ITEM */
.tgl-header { font-size:12px; font-weight:bold; color:var(--dim); margin:16px 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
.list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); }
.list-item:last-child { border-bottom:none; padding-bottom:0; }
.item-info { flex:1; }
.item-title { font-weight:bold; font-size:14px; }
.item-sub { font-size:11px; color:var(--dim); margin-top:2px; }
.item-price { text-align:right; font-weight:bold; color:var(--bad); font-size:14px; margin-left:12px; }
.btn-hapus { background:transparent; border:none; color:var(--dim); font-size:18px; cursor:pointer; padding:4px 8px; }
.btn-hapus:hover { color:var(--bad); }
</style>
</head>
<body>

<header>
  <div class="brand">CATATAN KELUAR</div>
  <div class="date-today" id="header-date"></div>
</header>

<main>
  <!-- VIEW UTAMA (CATAT & LIHAT) -->
  <section id="view-utama" class="view active">
    <div class="total-box">
      <label>Total Pengeluaran Hari Ini</label>
      <div class="uang" id="stat-total-hari-ini">Rp 0</div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Catat Pengeluaran</h2>
      <div class="form-group">
        <label>Buat Apa? (cth: Bensin, Parkir, Beli Es)</label>
        <input type="text" id="in-nama" placeholder="Keterangan...">
      </div>
      <div class="form-group">
        <label>Nominal (Rp)</label>
        <input type="number" id="in-nominal" placeholder="15000">
      </div>
      <button class="btn primary" onclick="simpanPengeluaran()">💸 Simpan Pengeluaran</button>
    </div>

    <h2>Riwayat Pengeluaran</h2>
    <div id="riwayat-list" class="card" style="max-height:400px; overflow-y:auto;">
      <!-- Diisi JS -->
    </div>
  </section>

  <!-- VIEW SETTING -->
  <section id="view-set" class="view" style="display:none;">
    <h2>Data & Backup</h2>
    <div class="card">
      <p style="font-size:12px; color:var(--dim); margin-top:0;">Data tersimpan sementara di browser HP ini. Jika browser ditutup atau di-refresh, data hilang. Selalu backup rutin!</p>
      <button class="btn ok" onclick="backupData()" style="margin-bottom:12px;">💾 Download Backup (CSV)</button>
      <button class="btn danger" onclick="hapusSemuaData()">🗑️ Hapus Semua Data</button>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="active" data-view="utama" onclick="pindahTab('utama')">📝<br>Catat</button>
  <button data-view="set" onclick="pindahTab('set')">⚙️<br>Backup</button>
</nav>

<script>
// State data
var dbPengeluaran = [];
var todayStr = new Date().toISOString().slice(0,10);

// Init Tanggal Header
var optDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', optDate);

// Helper Format
function fmtRp(n) {
  return "Rp " + Number(n).toLocaleString('id-ID');
}
function formatTanggalIndo(iso) {
  var b = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"];
  var p = iso.split('-');
  return parseInt(p[2]) + " " + b[parseInt(p[1])-1] + " " + p[0];
}

// Navigasi
function pindahTab(name) {
  var views = document.querySelectorAll('.view');
  for(var i=0; i<views.length; i++) views[i].style.display = 'none';
  document.getElementById('view-' + name).style.display = 'block';
  
  var btns = document.querySelectorAll('.bottom-nav button');
  for(var i=0; i<btns.length; i++) {
    if(btns[i].getAttribute('data-view') === name) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}

// ============ RENDER & LOGIKA ============
function renderRiwayat() {
  var list = document.getElementById('riwayat-list');
  list.innerHTML = '';

  if(dbPengeluaran.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:var(--dim); font-size:12px; margin:10px 0;">Belum ada catatan pengeluaran.</p>';
    document.getElementById('stat-total-hari-ini').innerText = "Rp 0";
    return;
  }

  // Urutkan dari yang terbaru
  dbPengeluaran.sort(function(a, b) {
    return b.id - a.id; 
  });

  var totalHariIni = 0;
  var lastDate = "";

  for(var i=0; i<dbPengeluaran.length; i++) {
    var p = dbPengeluaran[i];
    
    // Hitung total khusus hari ini
    if(p.date === todayStr) totalHariIni += p.nominal;

    // Tampilkan header tanggal kalau beda hari
    if(p.date !== lastDate) {
      var tglFormat = (p.date === todayStr) ? "Hari Ini (" + formatTanggalIndo(p.date) + ")" : formatTanggalIndo(p.date);
      var headerDiv = document.createElement('div');
      headerDiv.className = 'tgl-header';
      headerDiv.innerText = tglFormat;
      list.appendChild(headerDiv);
      lastDate = p.date;
    }

    // Baris Pengeluaran
    var div = document.createElement('div');
    div.className = 'list-item';
    
    div.innerHTML = '<div class="item-info">' +
                    '<div class="item-title">' + p.nama + '</div>' +
                    '<div class="item-sub">Jam ' + p.waktu + '</div>' +
                    '</div>' +
                    '<div style="display:flex; align-items:center;">' +
                    '<div class="item-price">- ' + fmtRp(p.nominal) + '</div>' +
                    '<button class="btn-hapus" onclick="hapusSatu(' + p.id + ')" title="Hapus">✕</button>' +
                    '</div>';
    list.appendChild(div);
  }

  document.getElementById('stat-total-hari-ini').innerText = fmtRp(totalHariIni);
}

function simpanPengeluaran() {
  var nama = document.getElementById('in-nama').value.trim();
  var nominal = parseFloat(document.getElementById('in-nominal').value);

  if(!nama) { alert('Keterangan wajib diisi! (cth: Bensin, Parkir)'); return; }
  if(isNaN(nominal) || nominal <= 0) { alert('Nominal harus berupa angka lebih dari 0!'); return; }

  var timeNow = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  var newId = dbPengeluaran.length > 0 ? dbPengeluaran[0].id + 1 : 1;

  dbPengeluaran.push({
    id: newId,
    date: todayStr,
    waktu: timeNow,
    nama: nama,
    nominal: nominal
  });

  // Reset input & fokus ke input nama
  document.getElementById('in-nama').value = '';
  document.getElementById('in-nominal').value = '';
  document.getElementById('in-nama').focus();

  renderRiwayat();
}

function hapusSatu(id) {
  if(!confirm('Hapus catatan ini?')) return;
  dbPengeluaran = dbPengeluaran.filter(function(x){ return x.id !== id; });
  renderRiwayat();
}

function hapusSemuaData() {
  if(!confirm('HAPUS SEMUA DATA PENGELUARAN? Ini tidak bisa dibatalkan. Pastikan sudah backup!')) return;
  dbPengeluaran = [];
  renderRiwayat();
  alert('Semua data berhasil dihapus.');
}

// ============ BACKUP CSV ============
function backupData() {
  if(dbPengeluaran.length === 0) { alert('Belum ada data untuk di-backup.'); return; }

  var csv = "TANGGAL,JAM,KETERANGAN,NOMINAL\n";
  
  // Urutkan dari terlama ke terbaru buat laporan
  var sorted = dbPengeluaran.slice().sort(function(a, b) { return a.id - b.id; });

  for(var i=0; i<sorted.length; i++) {
    var p = sorted[i];
    // Bungkus string pake kutip buat jaga-jaga kalau ada koma
    csv += '"'+p.date+'","'+p.waktu+'","'+p.nama+'",'+p.nominal+'\n';
  }

  var blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = "pengeluaran_jalanan_" + todayStr + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Boot
renderRiwayat();
</script>
</body>
</html>
